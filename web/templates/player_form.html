{% extends "base.html" %}

{% block title %}Добавить игрока - Тренеровочный планер{% endblock %}

{% block content %}
<h1>Добавить нового игрока</h1>

<form method="POST">
    <div class="form-group">
        <label for="name">Имя игрока:</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label>Позиции:</label>
        {% for position_id in positions %}
        <div>
            <label>
                <input type="checkbox" name="positions" value="{{ position_id }}"> 
                {{ position_id }}
            </label>
        </div>
        {% endfor %}
    </div>

    <button type="submit" class="btn">Создать игрока</button>
    <a href="{{ url_for('players') }}" class="btn btn-danger">Отмена</a>
</form>
{% endblock %}
